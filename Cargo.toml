[package]
name = "leptos-leaflet-wyatt"
version = "0.1.1"
edition = "2021"
description = "Leptos components for Leaflet.js maps (published as leptos-leaflet-wyatt; the leptos-leaflet name is taken on crates.io)"
license = "MIT"
repository = "https://github.com/WyattAu/leptos-leaflet"
keywords = ["leptos", "leaflet", "map", "wasm", "interactive"]
categories = ["web-programming", "wasm"]
exclude = ["/target"]

[dependencies]
leptos = { version = "0.8.15", default-features = false }
leptos_meta = { version = "0.8.5", default-features = false }
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.48"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlScriptElement", "HtmlLinkElement", "Node", "NodeList",
    "Event", "MouseEvent", "KeyboardEvent",
    "DomRect", "DomTokenList",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
islands = ["leptos/islands"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
